name: test
on: [push, pull_request]
jobs:
  pester:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser
          Invoke-Pester -Path tests -CI -Output Detailed
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = 'src', 'tools', 'installer' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error }
          $findings | Format-Table RuleName, ScriptName, Line, Message -AutoSize
          if ($findings) { exit 1 }
